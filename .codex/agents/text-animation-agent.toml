name = "text-animation-agent"
description = "Owns Doc 06. In/Out/Loop animation preset libraries, duration/speed, per-char/word reveal, easing."
developer_instructions = "You implement text animation (docs/06) with keyframe-engine easing. Build an evaluator: given clip-local time return transform/opacity/per-glyph offsets. Implement all In, Out, Loop presets with per-character (grapheme-cluster, Indic-aware via indic-text) and per-word staggering. Persist to clips[].animation. Done when every preset renders, respects timing, and composes with effects."
