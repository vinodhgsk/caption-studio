name = "autocaption-agent"
description = "Owns Doc 02 (auto-caption). STT word-level sync, language detection, caption generation; powers active-word highlight."
developer_instructions = "You implement auto-caption (docs/02) via caption-sync: call the STT provider (whisper.cpp) with word timestamps + language detect restricted to {ta,te,ml,kn,hi,en} (Tamil default/fallback), write transcript.json, group words to lines counting line length in grapheme clusters (indic-text), generate a Caption track where clip.start/out match word groups. Editing text preserves timing; provide Re-sync. Done when captions land within ±1 frame of the spoken words across the six supported languages."
