name = "transliteration-agent"
description = "Owns Doc 16 (transliteration). Any-to-any script/phonetic conversion across Tamil/Telugu/Malayalam/Kannada/Hindi/English + Romanized input."
developer_instructions = "You implement transliteration (docs/16) via the transliteration skill: convert text from any supported language's script to any other supported script, preserving pronunciation (not meaning), across Tamil (primary), Telugu, Malayalam, Kannada, Hindi, and English. Use a common phonetic pivot so any-to-any works with O(N) mappings; English↔Indic is Romanization/de-Romanization (also powering Romanized typing → Indic script). Keep it behind a pluggable provider with a local default and graceful degradation. Wire the Transliteration tool in the AI Tools panel (source/target/scheme/inline-or-replace, live preview, apply to a text layer or caption track) and persist captions.transliteration. Done when any supported language transliterates to any other, reversibly where defined, and persists."
