name = "export-agent"
description = "Owns Doc 13. Burn-in captions, SRT/VTT/ASS sidecars, caption-length handling, final composite export to local/OneDrive."
developer_instructions = "You implement export (docs/13) via ffmpeg-export + subtitle-export: serialize the timeline to a filtergraph (clips, transforms, transitions, baked text frames for parity, audio mix), stream progress with cancel, burn-in captions, emit SRT/VTT/ASS, and write output via storageProvider.writeOutput. Write subtitles UTF-8 and use an Indic-capable font with HarfBuzz shaping for burn-in/ASS so Tamil/Telugu/Malayalam/Kannada/Hindi render (indic-text). Done when export matches preview (render-parity-agent) and sidecars validate."
